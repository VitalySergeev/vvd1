{% extends "base.html" %}
{% block title %}Редактирование записи РУ{% endblock %}

{% block extra_head %}
<style>
    /* Стили для фиксированной панели */
    .fixed-toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 9999;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 15px 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        border-radius: 0 0 10px 10px;
        box-sizing: border-box;
    }

    .toolbar-container {
        display: flex;
        gap: 80px;
        align-items: center;
        justify-content: flex-start;
        max-width: 1400px;
        margin: 0 auto;
        flex-wrap: wrap;
    }

    .toolbar-btn {
        padding: 12px 30px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        text-decoration: none;
    }

    .toolbar-btn-save {
        background: #28a745;
        color: white;
        border: 2px solid #28a745;
    }

    .toolbar-btn-save:hover {
        background: #218838;
        border-color: #218838;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
    }

    .toolbar-btn-delete {
        background: #dc3545;
        color: white;
        border: 2px solid #dc3545;
    }

    .toolbar-btn-delete:hover {
        background: #c82333;
        border-color: #c82333;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
    }

    .toolbar-btn-close {
        background: white;
        color: #dc3545;
        border: 2px solid #dc3545;
    }

    .toolbar-btn-close:hover {
        background: #dc3545;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
    }

    .content-wrapper {
        margin-top: 80px;
        padding: 20px;
    }

    @media (max-width: 768px) {
        .toolbar-container {
            gap: 20px;
            flex-direction: column;
            align-items: stretch;
        }
        
        .toolbar-btn {
            width: 100%;
            justify-content: center;
        }
        
        .content-wrapper {
            margin-top: 200px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="fixed-toolbar">
    <div class="toolbar-container">
        <button type="submit" form="editRuForm" class="toolbar-btn toolbar-btn-save">
            💾 Сохранить
        </button>
        <button type="button" class="toolbar-btn toolbar-btn-delete" onclick="confirmDelete()">
            🗑️ Удалить
        </button>
        <a href="{{ url_for('manage_ru', person_id=person.id) }}" class="toolbar-btn toolbar-btn-close">
            ❌ Закрыть
        </a>
    </div>
</div>

<div class="content-wrapper">
    <div class="card mb-4">
        <div class="card-header bg-info text-white">
            <h5 class="mb-0">👤 Основная запись: {{ person.last_name }} {{ person.first_name }} {{ person.middle_name }}</h5>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-warning">
            <h5 class="mb-0">✏️ Редактирование записи РУ</h5>
        </div>
        <div class="card-body">
            <form method="post" id="editRuForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="executor" class="form-label">Кто выполнул</label>
                        <input type="text" class="form-control" id="executor" name="executor" value="{{ ru.executor or '' }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="amount" class="form-label">Сумма</label>
                        <input type="number" step="0.01" class="form-control" id="amount" name="amount" value="{{ ru.amount or '' }}" placeholder="0.00">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="document_number" class="form-label">Номер документа</label>
                        <input type="text" class="form-control" id="document_number" name="document_number" value="{{ ru.document_number or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="document_date" class="form-label">Дата документа</label>
                        <input type="date" class="form-control" id="document_date" name="document_date" value="{{ ru.document_date.strftime('%Y-%m-%d') if ru.document_date else '' }}">
                    </div>
                </div>
            </form>
            <form id="deleteForm" method="post" action="{{ url_for('delete_ru', ru_id=ru.id) }}" style="display: none;"></form>
        </div>
    </div>
</div>

<script>
function confirmDelete() {
    if (confirm('Вы уверены, что хотите удалить эту запись?')) {
        document.getElementById('deleteForm').submit();
    }
}
</script>
{% endblock %}
