{% extends "base.html" %}
{% block title %}Ввод данных{% endblock %}

{% block extra_head %}
<style>
    /* Глобальные стили для фиксированной панели */
    .global-fixed-toolbar {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        z-index: 99999 !important;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 15px 20px !important;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2) !important;
        border-radius: 0 0 10px 10px !important;
        box-sizing: border-box !important;
        margin: 0 !important;
    }

    .global-toolbar-container {
        display: flex !important;
        gap: 80px !important;
        align-items: center !important;
        justify-content: flex-start !important;
        max-width: 1400px !important;
        margin: 0 auto !important;
    }

    .global-toolbar-btn {
        padding: 12px 30px !important;
        font-size: 16px !important;
        font-weight: 600 !important;
        border: none !important;
        border-radius: 8px !important;
        cursor: pointer !important;
        transition: all 0.3s ease !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 8px !important;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1) !important;
        text-decoration: none !important;
    }

    .global-toolbar-btn-save {
        background: #28a745 !important;
        color: white !important;
        border: 2px solid #28a745 !important;
    }

    .global-toolbar-btn-save:hover {
        background: #218838 !important;
        border-color: #218838 !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3) !important;
    }

    .global-toolbar-btn-close {
        background: white !important;
        color: #dc3545 !important;
        border: 2px solid #dc3545 !important;
    }

    .global-toolbar-btn-close:hover {
        background: #dc3545 !important;
        color: white !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3) !important;
    }

    /* Контейнер для контента с отступом */
    .global-content-wrapper {
        margin-top: 80px !important;
        padding: 20px !important;
    }

    @media (max-width: 768px) {
        .global-toolbar-container {
            gap: 20px !important;
            flex-direction: column !important;
            align-items: stretch !important;
        }

        .global-toolbar-btn {
            width: 100% !important;
            justify-content: center !important;
        }

        .global-content-wrapper {
            margin-top: 140px !important;
        }
    }

    /* Скрываем заголовок */
    h2 {
        display: none !important;
    }
</style>
{% endblock %}

{% block content %}
<!-- Панель вне контейнеров -->
<div class="global-fixed-toolbar">
    <div class="global-toolbar-container">
        <button type="submit" form="dataForm" class="global-toolbar-btn global-toolbar-btn-save">
            💾 Сохранить
        </button>
        <a href="{{ url_for('all_records') }}" class="global-toolbar-btn global-toolbar-btn-close">
            ❌ Закрыть
        </a>
    </div>
</div>

<!-- Контент с отступом -->
<div class="global-content-wrapper">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Форма ввода</h5>
        </div>
        <div class="card-body">
            <form method="post" id="dataForm">
                <!-- 1. Общие данные (ФИО и дата рождения) -->
                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <h6 class="mb-0">👤 Личные данные</h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="last_name" class="form-label">Фамилия *</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="first_name" class="form-label">Имя *</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="middle_name" class="form-label">Отчество</label>
                                <input type="text" class="form-control" id="middle_name" name="middle_name">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="birth_date" class="form-label">Дата рождения</label>
                                <input type="date" class="form-control" id="birth_date" name="birth_date">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Первая группа полей с датами -->
                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <h6 class="mb-0">📅 Первая группа</h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="date2" class="form-label">Дата 2</label>
                                <input type="date" class="form-control" id="date2" name="date2">
                            </div>
                            <div class="col-md-8 mb-3">
                                <label for="place2" class="form-label">Место 2</label>
                                <input type="text" class="form-control" id="place2" name="place2">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. Категория (умное поле) - ИСПРАВЛЕНО -->
                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <h6 class="mb-0">🏷️ Категория</h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">Выберите категорию</label>
                                <select class="form-select" id="category" name="category" onchange="toggleOtherCategory()">
                                    <option value="">-- Выберите --</option>
                                    <option value="1">Параметр 1</option>
                                    <option value="2">Параметр 2</option>
                                    <option value="3">Параметр 3</option>
                                    <option value="4">Параметр 4</option>
                                    <option value="5">Параметр 5</option>
                                    <option value="6">Параметр 6</option>
                                    <option value="other">✏️ Свой вариант</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3" id="otherCategoryContainer" style="display: none;">
                                <label for="category_other" class="form-label">Введите свой вариант</label>
                                <input type="text" class="form-control" id="category_other" name="category_other" placeholder="Введите название категории">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 4. Должность, звание, номер -->
                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <h6 class="mb-0">💼 Служебная информация</h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="position" class="form-label">Должность</label>
                                <input type="text" class="form-control" id="position" name="position">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="rank" class="form-label">Звание</label>
                                <input type="text" class="form-control" id="rank" name="rank">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="number" class="form-label">Номер</label>
                                <input type="text" class="form-control" id="number" name="number">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 5. ЛП и связанные поля -->
                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <h6 class="mb-0">🏥 ЛП (Лечебное учреждение)</h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="lp" class="form-label">ЛП</label>
                                <input type="text" class="form-control" id="lp" name="lp">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lp_reason" class="form-label">Причина ЛП</label>
                                <input type="text" class="form-control" id="lp_reason" name="lp_reason">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 6. Места и ППР -->
                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <h6 class="mb-0">📍 Места и ППР</h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="place" class="form-label">Место</label>
                                <input type="text" class="form-control" id="place" name="place">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="ppr" class="form-label">ППР</label>
                                <input type="text" class="form-control" id="ppr" name="ppr">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label for="place2_field" class="form-label">Место 2</label>
                                <input type="text" class="form-control" id="place2_field" name="place2_field">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 7. Остальные даты -->
                <div class="card mb-3">
                    <div class="card-header bg-light">
                        <h6 class="mb-0">📅 Остальные даты</h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="date4" class="form-label">Дата 4</label>
                                <input type="date" class="form-control" id="date4" name="date4">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="ee" class="form-label">ЭЭ</label>
                                <input type="date" class="form-control" id="ee" name="ee">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="ee4" class="form-label">ЭЭ4</label>
                                <input type="date" class="form-control" id="ee4" name="ee4">
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Функция для поля "Категория" (свой вариант)
function toggleOtherCategory() {
    var select = document.getElementById('category');
    var otherContainer = document.getElementById('otherCategoryContainer');
    var otherInput = document.getElementById('category_other');

    if (select && otherContainer && otherInput) {
        if (select.value === 'other') {
            otherContainer.style.display = 'block';
            otherInput.required = true;
            otherInput.focus();
        } else {
            otherContainer.style.display = 'none';
            otherInput.required = false;
            otherInput.value = '';
        }
    }
}

// Инициализация при загрузке страницы
document.addEventListener('DOMContentLoaded', function() {
    var select = document.getElementById('category');
    var otherContainer = document.getElementById('otherCategoryContainer');
    var otherInput = document.getElementById('category_other');

    if (select && otherContainer && otherInput) {
        // Проверяем, не было ли уже выбрано "Свой вариант"
        if (select.value === 'other') {
            otherContainer.style.display = 'block';
            otherInput.required = true;
        }

        // Добавляем обработчик изменения
        select.addEventListener('change', toggleOtherCategory);
    }

    // Валидация формы перед отправкой
    var dataForm = document.getElementById('dataForm');
    if (dataForm) {
        dataForm.addEventListener('submit', function(e) {
            var select = document.getElementById('category');
            var otherInput = document.getElementById('category_other');

            if (select && select.value === 'other' && otherInput && !otherInput.value.trim()) {
                e.preventDefault();
                alert('Пожалуйста, введите свой вариант категории');
                otherInput.focus();
            }
        });
    }
});
</script>
{% endblock %}
